<!DOCTYPE html>
<html>
<head>
  <title>GBP Entity Selector</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: auto; }
    input, button { width: 100%; padding: 8px; margin: 6px 0; }
    .suggestions { border: 1px solid #ccc; max-height: 150px; overflow-y: auto; }
    .item { padding: 6px; cursor: pointer; }
    .item:hover { background: #eee; }
    .error { color: red; margin: 10px 0; }
    .success { color: green; margin: 10px 0; }
  </style>
</head>
<body>

<h2>Company & Competitors</h2>

<form id="gbpForm">
  <input type="email" name="email" placeholder="Email" required>

  <input id="company" placeholder="Company Name" autocomplete="off" required>
  <div id="company_suggestions" class="suggestions"></div>

  <input id="c1" placeholder="Competitor 1" autocomplete="off">
  <div id="c1_suggestions" class="suggestions"></div>

  <input id="c2" placeholder="Competitor 2" autocomplete="off">
  <div id="c2_suggestions" class="suggestions"></div>

  <input id="c3" placeholder="Competitor 3" autocomplete="off">
  <div id="c3_suggestions" class="suggestions"></div>

  <button id="submitBtn" type="submit">Submit</button>
  <div id="message"></div>
</form>

<script>
function setupAutocomplete(inputId, suggestionId) {
  const input = document.getElementById(inputId);
  const box = document.getElementById(suggestionId);
  let timer;

  input.addEventListener("input", () => {
    input.dataset.placeId = "";
    input.dataset.name = "";
    clearTimeout(timer);

    timer = setTimeout(async () => {
      if (input.value.length < 2) {
        box.innerHTML = "";
        return;
      }

      try {
        const res = await fetch(`/autocomplete?query=${encodeURIComponent(input.value)}`);
        if (!res.ok) throw new Error("Autocomplete failed");

        const data = await res.json();
        box.innerHTML = "";

        data.forEach(item => {
          const div = document.createElement("div");
          div.className = "item";
          div.innerText = item.name;

          div.onclick = () => {
            input.value = item.name;
            input.dataset.placeId = item.place_id;
            input.dataset.name = item.name;
            box.innerHTML = "";
          };

          box.appendChild(div);
        });

      } catch (err) {
        console.error("Autocomplete error:", err);
      }

    }, 300);
  });
}

["company","c1","c2","c3"].forEach(id =>
  setupAutocomplete(id, `${id}_suggestions`)
);

document.getElementById("gbpForm").addEventListener("submit", async e => {
  e.preventDefault();

  const messageBox = document.getElementById("message");
  const submitBtn = document.getElementById("submitBtn");
  messageBox.innerHTML = "";
  submitBtn.disabled = true;

  const email = document.querySelector("input[name='email']").value;
  const ids = ["company","c1","c2","c3"];

  const companies = ids
    .map(id => {
      const el = document.getElementById(id);
      if (!el.dataset.name || !el.dataset.placeId) return null;

      return {
        name: el.dataset.name,
        place_id: el.dataset.placeId
      };
    })
    .filter(Boolean);

  if (companies.length === 0) {
    messageBox.innerHTML = "<div class='error'>Please select at least one valid company.</div>";
    submitBtn.disabled = false;
    return;
  }

  try {
    const res = await fetch("/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, companies })
    });

    const result = await res.json();

    if (!res.ok) {
      throw new Error(result.detail || "Submission failed");
    }

    messageBox.innerHTML = "<div class='success'>Submitted successfully!</div>";
    e.target.reset();

  } catch (err) {
    messageBox.innerHTML = `<div class='error'>${err.message}</div>`;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
